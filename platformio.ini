[platformio]
default_envs = papermono
core_dir = .pio-core

[env:papermono]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages =
  tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.2/esptool.zip
framework = arduino
board = esp32-s3-devkitm-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/platformio-upload-time.py

build_flags =
  -std=gnu++2a
  -Iinclude
  '-DDAYRING_HOME_URL="app://shell/"'
  ; Disable Arduino runtime logging and the pre-setup chip report.
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DESP32_ARDUINO_NO_RGB_BUILTIN
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_PAPERMONO=1
  -DFREEINK_M5PM1_SDA=47
  -DFREEINK_M5PM1_SCL=48
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  LedManager=symlink://freeink-sdk/libs/hardware/LedManager

  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
